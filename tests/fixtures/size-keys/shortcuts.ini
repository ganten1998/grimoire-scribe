# The size keys bound by hand (z_qsize_7_quick_key): Q the sizes card of the pen in use, Shift+[ and Shift+]
# its next size down and up, B folds the toolbar, S Select mode, E the eraser, Esc back.
key.q=quick-size
key.Shift+code26=size-smaller
key.Shift+code27=size-larger
key.b=fold-panel
key.s=select
key.e=tool:eraser
key.Escape=back
