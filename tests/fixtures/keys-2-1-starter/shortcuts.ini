# Grimoire shortcuts. Enable in Settings > Shortcuts; after editing, Reload shortcuts.ini there.
# key.NAME or key.Ctrl+NAME=ACTION (an Apple keyboard's Cmd is Ctrl here); codeN is a Linux evdev key code;
# pad.NUMBER is a Linux evdev gamepad button code.
# A key may have one action in each place (the Library, a notebook page, the Pages view, the Graph,
# Pen feel): each action acts in its own places (docs/SHORTCUTS.md).
# Everywhere
key.Escape=back
key.Ctrl+s=save
# The Library
key.Ctrl+n=new-notebook
key.Ctrl+f=new-folder
key.s=share
key.o=settings
# A notebook page. 1 to 9: the tool picker's pens in its order, left to right and down; 0 and E: the eraser.
key.1=tool:pencil
key.2=tool:mech
key.3=tool:charcoal
key.4=tool:ballpoint
key.5=tool:fineliner
key.6=tool:marker
key.7=tool:fountain
key.8=tool:calligraphy
key.9=tool:highlighter
key.0=tool:eraser
key.e=tool:eraser
key.w=white
key.Ctrl+z=undo
key.Ctrl+Shift+z=redo
key.Ctrl+y=redo
key.Left=previous-page
key.Right=next-page
key.PageUp=previous-page
key.PageDown=next-page
key.Home=first-page
key.End=last-page
# [ and ]: the previous and the next tool.
key.code26=previous-tool
key.code27=next-tool
key.Ctrl+n=new-page
key.Ctrl+f=go-to-page
key.Ctrl+l=add-link
key.r=name-page
key.Space=two-finger-up
key.g=index-map
key.l=links
key.p=pages
key.t=tool-picker
key.s=select
key.x=hold-eraser
# - and = (+), Shift+=, the keypad's - and +, and with Ctrl: zoom out and in; Ctrl+0 the whole page.
key.code12=zoom-out
key.code13=zoom-in
key.Shift+code13=zoom-in
key.code74=zoom-out
key.code78=zoom-in
key.Ctrl+code12=zoom-out
key.Ctrl+code13=zoom-in
key.Ctrl+0=fit-page
# The Pages view and the Graph
key.Ctrl+a=select-all
# The Graph: the arrows move it; V its view.
key.Left=pan-left
key.Right=pan-right
key.Up=pan-up
key.Down=pan-down
key.v=graph-view
# Generic evdev gamepad defaults; controllers may report different codes.
pad.304=undo
pad.305=tool:eraser
pad.307=redo
pad.308=white
pad.310=previous-tool
pad.311=next-tool
pad.314=previous-page
pad.315=next-page
# Digital D-pad buttons and standard HAT0 directions share these bindings.
pad.Up=previous-tool
pad.Down=next-tool
pad.Left=previous-page
pad.Right=next-page
