# Grimoire shortcuts. Enable in Settings > Controller. Reload there after editing.
# key.NAME or key.Ctrl+NAME; pad.NUMBER is a Linux evdev gamepad button code.
# 1 to 9: the tool picker's pens in its order, left to right and down.
key.1=tool:pencil
key.2=tool:mech
key.3=tool:charcoal
key.4=tool:ballpoint
key.5=tool:fineliner
key.6=tool:marker
key.7=tool:fountain
key.8=tool:calligraphy
key.9=tool:highlighter
key.e=tool:eraser
key.w=white
key.Ctrl+z=undo
key.Ctrl+y=redo
key.Left=previous-page
key.Right=next-page
key.PageUp=previous-tool
key.PageDown=next-tool
# Generic evdev gamepad defaults; controllers may report different codes.
pad.304=undo
pad.305=tool:eraser
pad.307=redo
pad.308=white
pad.310=previous-tool
pad.311=next-tool
pad.314=previous-page
pad.315=next-page
# Digital D-pad buttons and standard HAT0 directions share these bindings.
pad.Up=previous-tool
pad.Down=next-tool
pad.Left=previous-page
pad.Right=next-page
