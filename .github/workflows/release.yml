name: Validate and package Grimoire
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
# A pull request's newer push cancels its older run (only its result matters); a push to main queues
# behind the one running; a release is never cancelled, and two releases never run at once.
concurrency:
  group: grimoire-${{ github.event_name == 'release' && 'publish' || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The toolchain the Kindle binary is built with. A local build with the same three versions makes
  # the same bytes (tests/repro_check.sh holds the build to that), so these are the versions the
  # maintainer's Mac must run before a release is tagged: docs/RELEASING.md, Before the tag.
  # Each is at least two weeks older than the release it builds.
  # Moving RUST_VERSION or ZIG_VERSION also means the worker's Scribe check again
  # (docs/RELEASING.md, What the workflow pins).
  RUST_VERSION: '1.97.1'
  ZIG_VERSION: '0.16.0'
  CARGO_ZIGBUILD_VERSION: '0.23.0'
  # cargo-deny, for the deny job (rust/deny.toml); published 2026-07-09.
  CARGO_DENY_VERSION: '0.20.2'
  # Retry a crate download before failing the job over a network blip.
  CARGO_NET_RETRY: '5'
  # The scenario shards (the scenarios job's matrix lists 1 to this; keep the two in step).
  SCENARIO_SHARDS: '6'
# make check, spread over jobs that run at once (docs/TESTING.md, Continuous integration, maps each
# job to the make targets it replaces):
#   changes      what the pull request touches: only docs (*.md, docs/, but not docs/whatsnew/ or
#                CHANGELOG.md, whose notes and dates the app compiles in) runs the docs job alone
#   build-host   the headless runner and the host tools, once, for the jobs below
#   unit         make test, its two halves at once
#   scenarios    make scenarios in SCENARIO_SHARDS shards (whole # root: chains, balanced by
#                tests/scenario-times.txt), each running its scenarios several at once
#   l10n         make l10n-check
#   host-checks  make host-checks: the late-timer scenarios, the share server, Live view, Bluetooth,
#                mirror cleanup, the pages cache, the exporter
#   package      the Kindle build, the zip and every check of it, the KPM package, the KOReader
#                patches; pushes to main and releases also build it twice from clean
#                (tests/repro_check.sh) and keep the release files
#   deny         cargo deny over the crates the app is built from (rust/deny.toml)
#   sandbox      the safe loader's real steps as root on Linux (rust/tests/test_sandbox_linux.rs)
#   gate         the one check branch protection requires: every job above passed (or, for a
#                docs-only pull request, the docs job did)
#   publish      releases: uploads the package job's release files and publishes the KPM channel
# The host jobs run on macOS, where the gate has always run. Setting the repository variable
# GRIMOIRE_CI_LINUX to true moves build-host, unit, scenarios and l10n to Linux runners (they start
# sooner, and many more run at once than macOS ones); it is off until a run shows them passing there.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      host: ${{ steps.filter.outputs.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - name: Decide what runs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LINUX: ${{ vars.GRIMOIRE_CI_LINUX }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            # Against the base branch's tip (a later change on it counts too: never too little).
            # --no-renames: a file moved into docs/ (or renamed to *.md) lists its old path too, so
            # moving code there is a code change.
            git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
            echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"
            if [ -s "$RUNNER_TEMP/changed.txt" ] &&
               ! grep -Ev '(\.md$|^docs/)' "$RUNNER_TEMP/changed.txt" | grep -q . &&
               ! grep -qE '^(docs/whatsnew/|CHANGELOG\.md$)' "$RUNNER_TEMP/changed.txt"; then
              code=false
            fi
          fi
          if [ "$LINUX" = true ]; then host=ubuntu-24.04; else host=macos-15; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "code jobs: $code; host jobs on $host"

  docs:
    # A pull request that changes only documentation: no build, no test; its diff must be clean.
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The whole history: the diff starts where the pull request branched off (BASE...HEAD),
          # so lines the base branch changed since are not the pull request's.
          fetch-depth: 0
      - name: No whitespace errors in the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE"
          git diff --check "$BASE"...HEAD

  build-host:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.host }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        # rustc and cargo, exactly RUST_VERSION. The Makefile finds them through RUST_BIN (the Mac
        # has a Homebrew rustc that shadows rustup's).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          echo "RUST_BIN=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")" >> "$GITHUB_ENV"
      - name: Build the headless runner and the host tools
        # make headless tools (make rust-check's headless and tools)
        run: |
          (cd rust && PATH="$RUST_BIN:$PATH" cargo fetch --locked)
          make headless tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-binaries
          path: |
            build/host/grimoire-headless
            build/host/grimoire-export
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  unit:
    # make test, its two halves (the host build's tests, the headless build's) as two jobs.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.host }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        half: [host, sim]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          echo "RUST_BIN=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")" >> "$GITHUB_ENV"
      - name: Unit tests (make test-${{ matrix.half }})
        run: |
          (cd rust && PATH="$RUST_BIN:$PATH" cargo fetch --locked)
          make test-${{ matrix.half }}

  scenarios:
    # make scenarios, shard N of SCENARIO_SHARDS (the selftest runs in shard 1).
    needs: [changes, build-host]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: host-binaries
          path: build/host/
      - name: Scenarios, shard ${{ matrix.shard }}
        # -o: the runner as build-host made it (artifacts do not keep the executable bit).
        run: |
          chmod +x build/host/*
          make -o build/host/grimoire-headless scenarios SCEN_SHARD="${{ matrix.shard }}/$SCENARIO_SHARDS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: scenario-logs-${{ matrix.shard }}
          path: |
            build/scen-logs/
            build/scen-times.txt
          retention-days: 7
          overwrite: true

  l10n:
    # make l10n-check, without the English Gothic run of y_all_screens.qs, which a shard made.
    needs: [changes, build-host]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.host }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install msgfmt
        run: |
          if [ "$(uname)" = Darwin ]; then
            brew install gettext
            echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -q && sudo apt-get install -y -q gettext
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: host-binaries
          path: build/host/
      - name: The languages
        run: |
          chmod +x build/host/*
          make -o build/host/grimoire-headless l10n-check L10N_SKIP=en-gothic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: l10n-logs
          path: build/scen-logs/
          retention-days: 7
          overwrite: true

  host-checks:
    # make host-checks, from the two scenarios whose data it reads. Always on macOS: the studio
    # picture check needs ImageMagick 7's magick, which Ubuntu's packages do not have (it would be
    # skipped). With GRIMOIRE_CI_LINUX on, build-host's binaries are Linux ones: it builds its own.
    needs: [changes, build-host]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test tools
        # ImageMagick for the studio picture (tests/share_check.sh); node is the runner image's.
        run: brew install imagemagick
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.changes.outputs.host == 'macos-15'
        with:
          name: host-binaries
          path: build/host/
      - name: Build the headless runner and the host tools (build-host's are Linux ones)
        if: needs.changes.outputs.host != 'macos-15'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          RUST_BIN=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")
          export RUST_BIN
          (cd rust && PATH="$RUST_BIN:$PATH" cargo fetch --locked)
          make headless tools
      - name: Share server, Live view, Bluetooth, late timers, exporter
        run: |
          chmod +x build/host/*
          make -o build/host/grimoire-headless scenarios SCEN_NO_SELFTEST=1 SCEN_TIMES= \
            SCENARIOS="tests/scenarios/b_library.qs tests/scenarios/s_shape_1_record.qs"
          make -o build/host/grimoire-headless host-checks

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    # The Kindle build, the zip and its checks; for pushes to main and releases also two clean builds
    # of every release file (tests/repro_check.sh), on a runner with three cores.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - name: Check release identity
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          case "$TAG" in *-*) test "$PRERELEASE" = true ;; *) test "$PRERELEASE" = false ;; esac
          # The history and the release tags, which the checkout above leaves out (one commit, the
          # tag's): the preflight finds the release before and checks that this version's notes,
          # docs/whatsnew/VERSION.md, are not that release's again. A fetch that fails fails the
          # step, so the check is never skipped here.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then unshallow=--unshallow; else unshallow=; fi
          git fetch --quiet --no-tags $unshallow origin '+refs/tags/v*:refs/tags/v*'
          # The changelog has this version's dated section and no placeholder; the README and
          # docs/TESTING.md name the version; this version has its What's new, new since the
          # release before (docs/RELEASING.md, The bump commit).
          tools/release-preflight.sh "$TAG"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test tools
        # Tools the checks run (luajit and luacheck for the KOReader plugin and patches, shellcheck
        # for the launchers); none of them makes a byte of a release file.
        run: brew install luajit shellcheck luacheck
      - name: Install Rust
        # rustc, cargo and the Kindle's standard library, exactly RUST_VERSION. The Makefile finds
        # them through RUST_BIN (the Mac has a Homebrew rustc that shadows rustup's).
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target armv7-unknown-linux-musleabihf --no-self-update
          rustup default "$RUST_VERSION"
          echo "RUST_BIN=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")" >> "$GITHUB_ENV"
      - name: Install zig
        # zig links the Kindle binary and compiles the vendored C (cargo-zigbuild runs it). The
        # archive's sha256 is written here, from ziglang.org's index for this release: the download
        # is checked against it, never against a hash that came with it.
        run: |
          case "$(uname -m)" in
            arm64) arch=aarch64 sum=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489 ;;
            x86_64) arch=x86_64 sum=0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7 ;;
            *) echo "no zig ${ZIG_VERSION} pinned for $(uname -m)"; exit 1 ;;
          esac
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-macos-${ZIG_VERSION}.tar.xz"
          echo "${sum}  ${RUNNER_TEMP}/zig.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        # From crates.io at its pinned version, with the crate's own Cargo.lock (--locked).
        run: |
          PATH="$RUST_BIN:$PATH" cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked --root "$RUNNER_TEMP/cargo-zigbuild"
          echo "$RUNNER_TEMP/cargo-zigbuild/bin" >> "$GITHUB_PATH"
      - name: Check the toolchain and fetch the crates
        # The versions are the pinned ones. rust/Cargo.lock decides every crate (--locked fails the
        # job on a lockfile that would change, instead of changing it); the Makefile's licenses step
        # reads the libc crate from the fetched sources.
        run: |
          test "$("$RUST_BIN/rustc" --version | cut -d' ' -f2)" = "$RUST_VERSION"
          test "$(zig version)" = "$ZIG_VERSION"
          test "$(cargo-zigbuild --version)" = "cargo-zigbuild $CARGO_ZIGBUILD_VERSION"
          "$RUST_BIN/rustc" -vV
          zig version
          (cd rust && PATH="$RUST_BIN:$PATH" cargo fetch --locked)
      - name: Build and check the package
        # make check's kindle, package-contents-check, launcher-check, dev-check, kpm-check,
        # kopatch-check, wifi-check, usb-stage-check, runner-check and dist.
        run: make package-contents-check launcher-check dev-check kpm-check kopatch-check wifi-check usb-stage-check runner-check dist
      - name: Build every release file twice from clean
        # make repro-check (tests/repro_check.sh): not for pull requests, whose files are never
        # published; pushes to main and releases.
        if: github.event_name != 'pull_request'
        run: make repro-check
      - name: Collect release files
        if: github.event_name != 'pull_request'
        run: |
          cp build/dist/Grimoire-"$(cat VERSION)".zip build/dist/KOReader-patches.zip build/kpm/
          cd build/kpm
          # "<sha256>  <name>" in byte order, no ./ prefix, as tools/dist.py writes them:
          # "shasum -a 256 -c SHA256SUMS.txt" checks the downloads in the folder that holds them.
          printf '%s\n' *.zip *.kpkg | LC_ALL=C sort | while IFS= read -r name; do shasum -a 256 "$name"; done > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
          shasum -a 256 -c SHA256SUMS.txt
          # In the log, to compare with a local make dist (its folder's SHA256SUMS.txt).
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: grimoire-release
          path: build/kpm/
          if-no-files-found: error
          # A rerun of this job replaces the artifact its first attempt uploaded.
          overwrite: true

  deny:
    # cargo deny over the crates the app is built from (docs/RELEASING.md step 3 and rust/deny.toml, D22): licenses,
    # the versions that appear twice (named in deny.toml), sources (crates.io only) and advisories.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          echo "RUST_BIN=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")" >> "$GITHUB_ENV"
      - name: Install cargo-deny
        # From crates.io at its pinned version (published 2026-07-09), with the crate's own Cargo.lock.
        run: |
          PATH="$RUST_BIN:$PATH" cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --root "$RUNNER_TEMP/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny/bin" >> "$GITHUB_PATH"
      - name: cargo deny check licenses bans sources advisories
        run: |
          cd rust
          PATH="$RUST_BIN:$PATH" cargo deny --locked check licenses bans sources advisories

  sandbox:
    # The safe loader's real steps (DESIGN.md 3.7, lane L5): the worker's namespaces, chroot, uid, no new
    # privileges, rlimits and seccomp filter need Linux and root, so rust/tests/test_sandbox_linux.rs runs here,
    # as root, with the sandbox required (GRIMOIRE_SANDBOX=require), and skips itself anywhere else. The
    # worker is the headless runner's binary; the allow-list is x86-64's here and ARM's on the Kindle (the
    # tests of the filter itself run for both in the unit job).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          echo "RUST_BIN=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")" >> "$GITHUB_ENV"
      - name: A tmpfs at /tmp, as the Kindle has
        # The worker's jail is made in /tmp and the sandbox refuses anything but tmpfs there (the Kindle's /tmp is
        # tmpfs; GitHub's runners have it on disk), so every spawn would fail at its chroot step without this.
        run: |
          sudo mount -t tmpfs -o size=1g,mode=1777 tmpfs /tmp
          findmnt -no FSTYPE /tmp
      - name: The sandbox tests, as root
        run: |
          (cd rust && PATH="$RUST_BIN:$PATH" cargo fetch --locked)
          cd rust
          sudo -E env "PATH=$RUST_BIN:$PATH" "HOME=$HOME" GRIMOIRE_SANDBOX=require \
            cargo test --locked --features sim --test test_sandbox_linux --test test_sec_spawn_fds --test test_sec_handshake -- --test-threads=1 --nocapture

  gate:
    # The one required check: every job of this run passed (a docs-only pull request: the docs job).
    # Branch protection on main must require this job (and no other: docs/TESTING.md, The required
    # check). It runs even in a cancelled run and fails there: a skipped required check counts as
    # passed, so a cancelled run of a pull request's newest commit must not leave it mergeable (a
    # run superseded by a newer push only marks its old commit red).
    if: ${{ always() }}
    needs: [changes, docs, build-host, unit, scenarios, l10n, host-checks, package, deny, sandbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | tee "$RUNNER_TEMP/results.txt"
          fail=0
          while read -r job result; do
            case "$job" in
              changes) want=success ;;
              docs) if [ "$CODE" = false ]; then want=success; else want=skipped; fi ;;
              *) if [ "$CODE" = true ]; then want=success; else want=skipped; fi ;;
            esac
            if [ "$result" != "$want" ]; then echo "$job: $result, wanted $want"; fail=1; fi
          done < "$RUNNER_TEMP/results.txt"
          exit "$fail"

  publish:
    needs: [gate, package]
    # Not a bare `github.event_name == 'release'`: a job's if without a status function means success() too,
    # which is false whenever a job upstream was skipped, and docs (through gate) always is on a code change.
    # v2.0.0-beta.2's run ended green with this job skipped: no files, no feed (docs/RELEASING.md, When
    # something fails). gate is the sum of the checks, so its result and package's are what count.
    if: ${{ !cancelled() && github.event_name == 'release' && needs.gate.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: grimoire-release
          path: build/kpm/
      - name: Upload release files and publish KPM channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # The artifact arrived whole: every file SHA256SUMS.txt names, with those bytes (the
          # Kindle's three).
          (cd build/kpm && shasum -a 256 -c SHA256SUMS.txt && test "$(wc -l < SHA256SUMS.txt)" -eq 3)
          # Idempotent when rerunning publication: existing assets must have identical bytes.
          for file in build/kpm/*.zip build/kpm/*.kpkg build/kpm/SHA256SUMS.txt; do
            name=$(basename "$file")
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
              mkdir -p "$RUNNER_TEMP/existing-assets"
              gh release download "$TAG" --pattern "$name" --dir "$RUNNER_TEMP/existing-assets" --clobber
              cmp "$file" "$RUNNER_TEMP/existing-assets/$name"
            else
              gh release upload "$TAG" "$file"
            fi
          done
          # Feed publication happens only after the referenced release assets exist.
          # The full ref name: a bare "kpm" also matches any other branch ending in /kpm.
          status=0
          git ls-remote --exit-code origin refs/heads/kpm >/dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch origin refs/heads/kpm
            git worktree add --detach "$RUNNER_TEMP/grimoire-feed" FETCH_HEAD
          elif [ "$status" = 2 ]; then
            # The first publication: the kpm branch starts with no files and no history.
            git worktree add --detach "$RUNNER_TEMP/grimoire-feed" HEAD
            git -C "$RUNNER_TEMP/grimoire-feed" checkout --orphan kpm
            git -C "$RUNNER_TEMP/grimoire-feed" rm -rfq .
          else
            exit "$status"
          fi
          python3 tools/kpm-feed.py build/kpm/manifest.json "$RUNNER_TEMP/grimoire-feed"
          cd "$RUNNER_TEMP/grimoire-feed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Grimoire $TAG to KPM"
            git push origin HEAD:refs/heads/kpm
          fi
